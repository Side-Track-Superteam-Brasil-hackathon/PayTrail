server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: paytrail-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paytrail}
    username: ${DB_USER:paytrail}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

paytrail:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: 72
  internal-secret: ${INTERNAL_SECRET:}
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
  solana:
    usdc-mint: ${SOLANA_USDC_MINT:4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
    cluster: ${SOLANA_CLUSTER:devnet}
  bcb:
    enabled: ${BCB_ENABLED:true}
    base-url: ${BCB_BASE_URL:https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata}
  seed:
    password: ${SEED_PASSWORD:}
    ana-solana-wallet: ${SEED_ANA_SOLANA_WALLET:}
